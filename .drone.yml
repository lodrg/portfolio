kind: pipeline
type: exec
name: default

platform:
  os: linux
  arch: x86_64

steps:
  - name: install and build
    commands:
      - npm install
      - npm build

  - name: deploy
    commands:
      - pm2 delete "next-app" || true  # 如果进程存在则删除，不存在也不会报错
      - pm2 start npm --name "next-app" -- start
    when:
      branch:
        - main  # 或者你的部署分支

trigger:
  branch:
    - main  # 或者你的部署分支
  event:
    - push