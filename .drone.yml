kind: pipeline
type: docker
name: default

steps:
  - name: install and build and deploy
    image: node:23
    commands:
      - npm install
      - npm build
      - pm2 delete "next-app" || true  # 如果进程存在则删除，不存在也不会报错
      - pm2 start npm --name "next-app" -- start
    when:
      branch:
        - main  # 或者你的部署分支

trigger:
  branch:
    - main  # 或者你的部署分支
  event:
    - push