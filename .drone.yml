kind: pipeline
type: exec
name: default

steps:
  - name: deploy
    commands:
      - cd /home/administrator/xuan/portfolio
      - git pull
      - npm install
      - npm run build
      - pm2 restart "next-app" || pm2 start npm --name "next-app" -- start

trigger:
  branch:
    - main
  event:
    - push